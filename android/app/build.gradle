plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ---- Release signing -------------------------------------------------------
// A fixed key is what lets a new build install OVER the old one (no uninstall).
// The key is NOT stored in the repo: CI provides it through 4 environment
// variables. Without them (local runs) the build falls back to the debug key.
def mozaikKeystoreB64 = System.getenv("MOZAIK_KEYSTORE_BASE64")
def mozaikKeystoreFile = null
if (mozaikKeystoreB64 != null && !mozaikKeystoreB64.trim().isEmpty()) {
    mozaikKeystoreFile = new File(layout.buildDirectory.get().asFile, "mozaik-release.jks")
    mozaikKeystoreFile.parentFile.mkdirs()
    mozaikKeystoreFile.bytes = Base64.getDecoder().decode(mozaikKeystoreB64.replaceAll("\\s", ""))
}

android {
    namespace = "com.example.upgrade"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.upgrade"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (mozaikKeystoreFile != null) {
            mozaikRelease {
                storeFile mozaikKeystoreFile
                storePassword System.getenv("MOZAIK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MOZAIK_KEY_ALIAS")
                keyPassword System.getenv("MOZAIK_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Fixed release key when CI provides it, debug key otherwise.
            signingConfig = (mozaikKeystoreFile != null) ? signingConfigs.mozaikRelease : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
