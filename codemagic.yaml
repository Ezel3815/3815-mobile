workflows:
  android-workflow:
    name: Android Build
    environment:
      flutter: 3.47.1
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate app icons from the single brand image
        script: dart run flutter_launcher_icons
      - name: Analyze
        script: flutter analyze
      - name: Unit tests
        script: flutter test
      - name: Build debug APK (verification)
        script: flutter build apk --debug
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
